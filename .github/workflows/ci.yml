name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  proverka:
    name: Пълната проверка · всичките порти · и проходът два пъти поред
    runs-on: ubuntu-latest
    steps:
      # Цялата история, не само последният коммит: `dnevnik --proveri` чете
      # авторската дата на HEAD и номерата на коммитите след пина (Д1 · Д8).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # ЕДНА стъпка, не изброени. Изброяването се разминава: `npm run proverka`
      # порасна от седем на дванайсет порти, докато тук стоеше число. Домът на
      # списъка е `package.json`; тук се ВИКА, не се преписва (правило 14 · 17).
      - name: Пълната проверка · всичките порти
        run: npm run proverka

      - name: Браузър за прохода
        run: npx playwright-core install --with-deps chromium

      # Проходът проверява какво ПИШЕ НА ЕКРАНА. Без него регресия в изгледа
      # минава зелено. ДВА ПЪТИ ПОРЕД (CLAUDE.md · правило 30), не веднъж и не с
      # повторение при падане: повторението минава при 1 от 2 и крие точно
      # мигащия проход; „два пъти" иска 2 от 2.
      - name: Проход през истински браузър · първи път
        run: npm run proba

      - name: Проход през истински браузър · втори път
        run: npm run proba
